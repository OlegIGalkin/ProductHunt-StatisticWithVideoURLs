name: Update Product Hunt catalog

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional: override target date (YYYY-MM-DD, LA timezone). Leave empty for today."
        required: false
        default: ""
  schedule:
    # GitHub cron runs in UTC. The script interprets "today" via PH_TZ.
    #
    # Each cron below lands near its intended LA-local slot in BOTH PST and
    # PDT (see table in the PR/commit message). This removes the need for a
    # DST guard step entirely — which was fragile because GitHub's cron
    # delivery can be delayed by hours, and any wall-clock check would then
    # skip a valid run.
    #
    # End of LA day  (~22:50 PST / 23:50 PDT)
    - cron: "50 6 * * *"
    # Start of LA day (~00:05 PST / 01:05 PDT)
    - cron: "5 8 * * *"
    # Midday LA       (~12:00 PST / 13:00 PDT)
    - cron: "0 20 * * *"

permissions:
  contents: write

# Serialise runs so two of them never race for the same PRODUCTHUNT_TOKEN
# bucket, and so two concurrent pushes can't collide on the branch.
concurrency:
  group: producthunt-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git rebase origin/<branch>` works after a race.
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install libsql

      - name: Update daily report + README + Turso DB
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          PH_TZ: "America/Los_Angeles"
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DATE: ${{ github.event.inputs.date }}
        run: python3 scripts/update_catalog.py

      - name: Commit & push (if changed)
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi

          # ---- Resolve the target branch reliably -----------------------
          BRANCH="${GITHUB_REF_NAME:-}"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "HEAD" ]; then
            BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          fi
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "HEAD" ]; then
            BRANCH="$(git remote show origin | awk '/HEAD branch/ {print $NF}')"
          fi
          echo "Target branch: ${BRANCH}"

          CURRENT_HEAD="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$CURRENT_HEAD" = "HEAD" ]; then
            git checkout -B "$BRANCH"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase    true
          git config rebase.autoStash true

          git add -A
          git commit -m "chore: update Product Hunt daily stats"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "── Push attempt ${attempt}/${MAX_ATTEMPTS} ──"

            if ! git fetch origin "$BRANCH"; then
              echo "Fetch failed; sleeping and retrying."
              sleep $((attempt * 5))
              continue
            fi

            if ! git rebase "origin/${BRANCH}"; then
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                echo "Rebase conflict; aborting rebase."
                git rebase --abort || true
              fi
              echo "Rebase failed on attempt ${attempt}; sleeping and retrying."
              sleep $((attempt * 5))
              continue
            fi

            if git push origin "HEAD:${BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; refetching and retrying."
            sleep $((attempt * 5))
          done

          echo "Push failed after ${MAX_ATTEMPTS} attempts." >&2
          exit 1